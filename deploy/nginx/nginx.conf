# Nginx reverse proxy configuration for Notebench
# Upstream application server (configurable host and port, defaults to 127.0.0.1:3000)
upstream notebench_upstream {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name _;

    # Client body size limit for large PDF/source uploads
    client_max_body_size 100M;

    location / {
        proxy_pass http://notebench_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for Server-Sent Events (SSE) realtime streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
