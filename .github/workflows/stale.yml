name: Stale Issue Automation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "help wanted,good first issue,breaking-change"
          exempt-pr-labels: "help wanted,good first issue,breaking-change"
          stale-issue-message: >
            This issue has had no activity for 60 days. It will close in 14 days if
            no further activity occurs. Comment to keep it open.
          stale-pr-message: >
            This pull request has had no activity for 60 days. It will close in 14 days if
            no further activity occurs.
