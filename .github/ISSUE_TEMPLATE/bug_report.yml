name: Bug Report
description: Report a bug or defect in Notebench
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure this is not a security vulnerability (see [SECURITY.md](https://github.com/harzhtiwari/Notebench/blob/main/SECURITY.md)).
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Upload source document 'test.pdf'
        2. Query 'summary of section 2'
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, Model provider, and deployment mode (Docker vs local).
      placeholder: Node 22.12.0, Windows 11, Ollama (Llama 3), Local dev
    validations:
      required: true
