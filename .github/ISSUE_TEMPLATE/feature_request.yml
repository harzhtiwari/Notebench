name: Feature Request
description: Propose an idea or feature for Notebench
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [VISION.md](https://github.com/harzhtiwari/Notebench/blob/main/VISION.md) to ensure your proposed feature is aligned with Notebench's core focus and not an explicit anti-goal.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or limitation does this feature address?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or workarounds have you considered?
