[project]
name = "doc-tools"
version = "0.1.0"
description = "Pure MIT/Apache document processing worker pool for Notebench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
